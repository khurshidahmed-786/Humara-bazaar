<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rider Operations | Hamara Bazaar</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
      .ops{max-width:1160px;margin:auto;padding:24px 16px 110px}
      .opsTop{display:flex;justify-content:space-between;gap:16px}
      .muted{color:#777;font-size:13px}
      .opsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
      .stat{background:#fff;border:1px solid #e3e6df;border-radius:16px;padding:15px}
      .stat strong{display:block;font-size:25px}
      .stat span{font-size:12px;color:#777}
      .tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}
      .tab{border:1px solid #dfe4d9;background:#fff;padding:10px 14px;border-radius:999px;white-space:nowrap}
      .tab.active{background:#667744;color:#fff}
      .pane{display:none}
      .pane.active{display:block}
      .section{background:#fff;border:1px solid #e3e6df;border-radius:18px;padding:16px;margin:14px 0}
      .row{border-bottom:1px solid #eee;padding:13px 0}
      .row:last-child{border:0}
      .btn{padding:9px 12px;border:0;border-radius:10px;background:#667744;color:#fff}
      .input{padding:9px;border:1px solid #ddd;border-radius:10px;width:100%;margin:8px 0}@media(max-width:800px)
      {.opsGrid{grid-template-columns:repeat(2,1fr)}
       .opsTop{flex-direction:column}}
    </style>
  </head>
  <body>
    <div id="headerContainer"></div>
    <main class="ops">
      <div class="opsTop"><div>
        <h1>Rider Operations</h1>
        <p class="muted">Riders, live trips, issues, COD and settlements for your tehsil.</p>
      </div>
        <button class="btn" id="refresh">Refresh</button>
      </div>
      <div class="opsGrid" id="stats"></div>
      <div class="tabs">${['overview','riders','trips','orders','issues','cod','settlements'].map((x,i)=>`
        <button class="tab ${i===0?'active':''}" data-tab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${['overview','riders','trips','orders','issues','cod','settlements'].map((x,i)=>`<section id="p-${x}" class="pane ${i===0?'active':''}"></section>`).join('')}</main><div id="bottomNavContainer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/db.js"></script><script src="js/database.js"></script><script src="js/components.js"></script><script>let tid=0,d={};const esc=v=>{const e=document.createElement('div');e.textContent=v??'';return e.innerHTML};async function load(){const u=await authGetCurrentUser();if(!u){location.href='login.html?redirect=rider-operations.html';return}const r=await dbGetMyRole();tid=Number(r?.tehsil_id||0);if(!tid){document.getElementById('p-overview').innerHTML='<div class="section">Tehsil unavailable.</div>';return}const q=await sb.rpc('fn_admin_get_rider_operations',{p_tehsil_id:tid});if(q.error){document.getElementById('p-overview').innerHTML='<div class="section"><b>Not authorized or unavailable.</b><p class="muted">'+esc(q.error.message)+'</p></div>';return}d=q.data||{};render()}function render(){const rs=d.riders||[],tr=d.active_trips||[],or=d.available_orders||[],is=d.open_issues||[],cs=d.cod_submissions||[],ss=d.settlements||[];document.getElementById('stats').innerHTML=[['Approved',rs.filter(x=>x.status==='approved').length],['Online',rs.filter(x=>x.availability==='online').length],['Active trips',tr.length],['Issues',is.length],['Available orders',or.length],['COD outstanding','₹'+rs.reduce((n,x)=>n+Number(x.cod_outstanding||0),0)],['Today earnings','₹'+rs.reduce((n,x)=>n+Number(x.today_earnings||0),0)],['Draft settlements',ss.filter(x=>x.status==='draft').length]].map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');document.getElementById('p-overview').innerHTML='<div class="section"><h2>Operations Snapshot</h2><p class="muted">'+or.length+' available orders · '+tr.length+' active trips · '+is.length+' open issues · '+cs.length+' COD submissions.</p></div>';document.getElementById('p-riders').innerHTML='<div class="section"><h2>Riders</h2>'+rs.map(x=>`<div class="row"><b>${esc(x.full_name)}</b> · ${esc(x.status)} · ${esc(x.availability||'offline')}<div class="muted">Today ${Number(x.today_deliveries||0)} deliveries · ₹${Number(x.today_earnings||0)} earnings · COD outstanding ₹${Number(x.cod_outstanding||0)}</div></div>`).join('')+'</div>';document.getElementById('p-trips').innerHTML='<div class="section"><h2>Live Trips</h2>'+tr.map(x=>`<div class="row"><b>Trip #${x.trip_id}</b> · ${esc(x.rider_name)}<div class="muted">${x.completed_count||0}/${x.order_count||0} completed · ₹${Number(x.earnings||0)}</div></div>`).join('')+'</div>';document.getElementById('p-orders').innerHTML='<div class="section"><h2>Available Orders</h2>'+or.map(x=>`<div class="row"><b>Order #${x.id}</b> · ₹${Number(x.total||0)}<div class="muted">${esc(x.customer_name||'Customer')} · ${esc(x.customer_address||'')}</div></div>`).join('')+'</div>';document.getElementById('p-issues').innerHTML='<div class="section"><h2>Issues</h2>'+is.map(x=>`<div class="row"><b>Order #${x.order_id}</b> · ${esc(x.issue_type)} · ${esc(x.status)}<div class="muted">${esc(x.rider_name)} · ${esc(x.description||'')}</div></div>`).join('')+'</div>';document.getElementById('p-cod').innerHTML='<div class="section"><h2>COD</h2>'+cs.map(x=>`<div class="row"><b>Submission #${x.id}</b> · ${esc(x.rider_name)} · ${esc(x.status)}<div class="muted">Expected ₹${Number(x.expected_amount||0)} · Submitted ₹${Number(x.submitted_amount||0)}${x.verified_amount!=null?' · Verified ₹'+Number(x.verified_amount):''}</div>${x.status!=='verified'&&x.status!=='cancelled'?`<input class="input" id="v-${x.id}" type="number" min="0" step="0.01" value="${Number(x.submitted_amount||0)}"><button class="btn" data-v="${x.id}">Verify Cash</button>`:''}</div>`).join('')+'</div>';document.getElementById('p-settlements').innerHTML='<div class="section"><h2>Settlements</h2>'+ss.map(x=>`<div class="row"><b>${esc(x.rider_name)}</b> · ${esc(x.status)}<div class="muted">Gross ₹${Number(x.gross_amount||0)} · Net ₹${Number(x.net_amount||0)}</div></div>`).join('')+'</div>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{try{const q=await sb.rpc('fn_admin_verify_cod_submission',{p_submission_id:Number(b.dataset.v),p_verified_amount:Number(document.getElementById('v-'+b.dataset.v).value||0),p_notes:null});if(q.error)throw q.error;alert(q.data?.status==='verified'?'COD verified.':'COD discrepancy recorded.');await load()}catch(e){alert(e.message||'Verification failed')}})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+b.dataset.tab).classList.add('active')});document.getElementById('refresh').onclick=load;load();</script><script>renderLayout?.('services');</script></body></html>
