<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rider Operations | Hamara Bazaar</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/admin.css">
<style>
.ops{max-width:1100px;margin:auto;padding:24px 16px 100px}
.ops h1{margin-bottom:6px}.muted{color:#777;font-size:13px}
.ops-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.ops-stat{background:#fff;border:1px solid #e3e6df;border-radius:16px;padding:15px}.ops-stat strong{display:block;font-size:25px}.ops-stat span{font-size:12px;color:#777}
.ops-section{background:#fff;border:1px solid #e3e6df;border-radius:18px;padding:16px;margin:14px 0}
.ops-row{border-bottom:1px solid #eee;padding:13px 0}.ops-row:last-child{border-bottom:0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef3ea}
.btn{padding:9px 12px;border:0;border-radius:10px;background:#667744;color:#fff;cursor:pointer}.btn.alt{background:#fff;color:#667744;border:1px solid #667744}
@media(max-width:760px){.ops-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="headerContainer"></div>
<main class="ops">
<h1>Rider Operations</h1>
<p class="muted">Operational control for riders, trips, available deliveries, issues and COD.</p>
<div id="ops"></div>
</main>
<div id="bottomNavContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/db.js"></script>
<script src="js/components.js"></script>
<script>
async function loadRiderOps(){
 const user=await authGetCurrentUser();
 if(!user){location.href="login.html";return;}
 const roles=await dbGetCurrentUserRoles?.().catch(()=>[]);
 const role=Array.isArray(roles)?roles:[]; 
 let tehsilId=null;
 if(typeof dbGetMyTehsil==="function"){try{const t=await dbGetMyTehsil();tehsilId=t?.id||t?.tehsil_id;}catch(e){}}
 if(!tehsilId){document.getElementById("ops").innerHTML="<div class='ops-section'>Unable to determine your tehsil.</div>";return;}
 const {data,error}=await sb.rpc("fn_admin_get_rider_operations",{p_tehsil_id:Number(tehsilId)});
 if(error){document.getElementById("ops").innerHTML=`<div class='ops-section'>${error.message}</div>`;return;}
 renderOps(data||{});
}
function esc(v){const e=document.createElement("div");e.textContent=v??"";return e.innerHTML;}
function renderOps(d){
 const riders=d.riders||[],trips=d.active_trips||[],orders=d.available_orders||[],issues=d.open_issues||[],cod=d.cod_submissions||[];
 document.getElementById("ops").innerHTML=`
 <div class="ops-grid">
  <div class="ops-stat"><strong>${riders.filter(r=>r.status==="approved").length}</strong><span>Approved riders</span></div>
  <div class="ops-stat"><strong>${riders.filter(r=>r.availability==="online").length}</strong><span>Online riders</span></div>
  <div class="ops-stat"><strong>${trips.length}</strong><span>Active trips</span></div>
  <div class="ops-stat"><strong>${issues.length}</strong><span>Open delivery issues</span></div>
 </div>
 <section class="ops-section"><h2>Available Orders</h2>${orders.length?orders.map(o=>`<div class="ops-row"><strong>Order #${esc(o.id)}</strong> · ₹${esc(o.total)}<div class="muted">${esc(o.customer_name)} · ${esc(o.customer_address)}</div></div>`).join(""):"<p class='muted'>No available orders.</p>"}</section>
 <section class="ops-section"><h2>Active Trips</h2>${trips.length?trips.map(t=>`<div class="ops-row"><strong>Trip #${esc(t.trip_id)}</strong> · ${esc(t.rider_name)}<div class="muted">${esc(t.order_count)} orders · ₹${esc(t.earnings)}</div></div>`).join(""):"<p class='muted'>No active trips.</p>"}</section>
 <section class="ops-section"><h2>Delivery Issues</h2>${issues.length?issues.map(i=>`<div class="ops-row"><strong>Order #${esc(i.order_id)}</strong> · ${esc(i.issue_type)}<div class="muted">${esc(i.rider_name)} · ${esc(i.description||"")}</div></div>`).join(""):"<p class='muted'>No open issues.</p>"}</section>
 <section class="ops-section"><h2>COD Submissions</h2>${cod.length?cod.map(c=>`<div class="ops-row"><strong>#${esc(c.id)} · ${esc(c.rider_name)}</strong><div class="muted">Expected ₹${esc(c.expected_amount)} · Submitted ₹${esc(c.submitted_amount)} · ${esc(c.status)}</div></div>`).join(""):"<p class='muted'>No pending COD submissions.</p>"}</section>`;
}
loadRiderOps();
</script>
<script>renderLayout?.("services");</script>
</body>
</html>
