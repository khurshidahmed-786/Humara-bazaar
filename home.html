<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hamara Bazaar</title>

    <link
        rel="stylesheet"
        href="css/theme.css">

    <link
        rel="stylesheet"
        href="css/components.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link
        rel="stylesheet"
        href="css/index.css">

<link rel="stylesheet" href="css/mobile.css">
</head>


<body>


<!-- ==========================
     HEADER (top nav + sidebar)
========================== -->

<div id="headerContainer"></div>


<main>


<!-- ==========================
     SEARCH
========================== -->

<section class="searchSection">

    <div class="searchBox">

        <span class="searchIcon">

            🔍

        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search products">

    </div>

</section>



<!-- ==========================
     SHOPS
========================== -->

<section class="section">

    <div class="sectionHeader">

        <h2>

            🏪 Shops Near You

        </h2>

        <a href="shops.html">

            View All

        </a>

    </div>

    <div
        id="shopScroll"
        class="productScroll">

    </div>

</section>



<!-- ==========================
     FEATURED PRODUCTS
========================== -->

<section class="section" id="featuredSection" style="display:none;">

    <div class="sectionHeader">
        <h2>⭐ Featured</h2>
    </div>

    <div id="featuredScroll" class="productScroll"></div>

</section>



<!-- ==========================
     NEW ARRIVALS
========================== -->

<section class="section" id="newArrivalSection" style="display:none;">

    <div class="sectionHeader">
        <h2>🆕 New Arrivals</h2>
    </div>

    <div id="newArrivalScroll" class="productScroll"></div>

</section>



<!-- ==========================
     DISCOUNTED
========================== -->

<section class="section" id="discountedSection" style="display:none;">

    <div class="sectionHeader">
        <h2>🏷 Discounted</h2>
    </div>

    <div id="discountedScroll" class="productScroll"></div>

</section>



<!-- ==========================
     FILTER BAR (category + sort)
========================== -->

<section class="filterBar">

    <select
        id="categoryFilter"
        class="filterSelect">

        <option value="">All Categories</option>

    </select>

    <select
        id="sortFilter"
        class="filterSelect">

        <option value="newest">Newest First</option>
        <option value="price_low">Price: Low to High</option>
        <option value="price_high">Price: High to Low</option>

    </select>

</section>



<!-- ==========================
     PRODUCT FEED (endless scroll)
========================== -->

<section class="section">

    <div class="sectionHeader">

        <h2>

            🛍 All Products

        </h2>

    </div>

    <div
        id="productGrid"
        class="productGrid">

    </div>

    <div
        id="feedLoading"
        class="feedLoading">

        Loading products...

    </div>

    <div
        id="feedEmpty"
        class="emptyState"
        style="display:none;">

        <div class="emptyIcon">🔍</div>
        <p>No products found. Try a different search or category.</p>

    </div>

    <div
        id="feedSentinel">

    </div>

</section>


</main>



<!-- ==========================
     BOTTOM NAVIGATION
========================== -->

<div id="bottomNavContainer"></div>



<!-- ==========================
     JAVASCRIPT
========================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/deliveryPricing.js"></script>
<script src="js/db.js"></script>
<script src="js/database.js"></script>

<script src="js/auth.js"></script>

<script src="js/shop.js"></script>

<script src="js/product.js"></script>

<script src="js/service.js"></script>

<script src="js/categories.js"></script>


<script src="js/cart.js"></script>

<script src="js/components.js"></script>

<script src="js/index.js"></script>


<script>

renderLayout("home");

</script>


</body>

</html>
