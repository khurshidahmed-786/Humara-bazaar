<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become a Rider | Hamara Bazaar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#FAF6EE;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:520px;
}

h1{
    margin-bottom:10px;
    color:#345D2A;
}

p{
    color:#666;
    margin-bottom:20px;
}

label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#345D2A;
    margin-top:14px;
    margin-bottom:4px;
}

input,select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:Arial;
}

button{
    padding:16px;
    margin-top:20px;
    background:#667744;
    color:white;
    border:none;
    border-radius:12px;
    width:100%;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.error{
    color:#B63A3A;
    margin-top:15px;
    display:none;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:8px 18px;
    border-radius:20px;
    font-weight:700;
    font-size:14px;
}

.badge.pending{ background:#FFF4E0; color:#B97A2B; }
.badge.approved{ background:#EAF4E2; color:#345D2A; }
.badge.rejected{ background:#FBE7E7; color:#B63A3A; }

</style>

<link rel="stylesheet" href="css/mobile.css">
</head>


<body>


<div class="box" id="loadingBox">
    <p>Loading...</p>
</div>

<div class="box" id="statusBox" style="display:none;"></div>

<div class="box" id="formBox" style="display:none;">

<h1>Become a Rider</h1>
<p>Deliver orders in your tehsil. Applications are reviewed by your Tehsil Admin.</p>

<label>Full Name *</label>
<input id="fullName" placeholder="Your full name">

<label>Phone *</label>
<input id="phone" placeholder="Mobile number" type="tel">

<label>Tehsil *</label>
<select id="tehsilSelect"><option value="">Select your tehsil</option></select>

<label>Vehicle Type</label>
<select id="vehicleType">
    <option value="">Select vehicle type</option>
    <option value="Bicycle">Bicycle</option>
    <option value="Scooter">Scooter</option>
    <option value="Motorcycle">Motorcycle</option>
    <option value="Auto">Auto</option>
</select>

<label>Vehicle Number</label>
<input id="vehicleNumber" placeholder="e.g. JK02AB1234">

<label>ID / Vehicle Document (optional)</label>
<input id="documentFile" type="file">

<button id="submitBtn">Submit Application</button>

<div id="error" class="error"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/deliveryPricing.js"></script>
<script src="js/db.js"></script>

<script src="js/riderapply.js"></script>


</body>

</html>
