<!DOCTYPE html>

<html>

<head>

<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#FAF6EE;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:420px;
background:white;
padding:40px;
border-radius:24px;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border-radius:10px;
border:1px solid #ddd;
}

.btn{
display:block;
width:100%;
margin-top:20px;
padding:16px;
background:#B63A3A;
color:white;
text-align:center;
text-decoration:none;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

.btn:disabled{
opacity:0.6;
cursor:not-allowed;
}

.skip{
display:block;
margin-top:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h1>Welcome Back</h1>

<p>Login to your account</p>

<input id="email" placeholder="Email" type="email">
<input id="password" placeholder="Password" type="password">

<button class="btn" id="loginBtn">Login</button>

<p id="error" style="color:#B63A3A; margin-top:15px; display:none;"></p>

<br>

<a href="register.html">Create Account</a>
<a class="skip" href="/">Continue as Guest</a>

</div>

<!-- Supabase (real backend) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/db.js"></script>

<script>

document.getElementById("loginBtn").onclick = async function(){

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const error = document.getElementById("error");
    const btn = document.getElementById("loginBtn");

    error.style.display = "none";

    if(!email || !password){
        error.innerText = "Please enter your email and password.";
        error.style.display = "block";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Logging in...";

    try {

      await authSignIn(email, password);

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect");
        const safeRedirect = redirect && /^[a-zA-Z0-9_-]+\.html$/.test(redirect) ? redirect : "index.html";

        window.location.href = safeRedirect;

    } catch(err) {

        console.error(err);
        error.innerText = "Incorrect email or password.";
        error.style.display = "block";

        btn.disabled = false;
        btn.innerText = "Login";
    }

};

</script>
</body>

</html>
