<!DOCTYPE html>

<html>

<head>

<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#FAF6EE;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:420px;
background:white;
padding:40px;
border-radius:24px;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border-radius:10px;
border:1px solid #ddd;
}

.btn{
display:block;
width:100%;
margin-top:20px;
padding:16px;
background:#B63A3A;
color:white;
text-align:center;
text-decoration:none;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

.btn:disabled{
opacity:0.6;
cursor:not-allowed;
}

.skip{
display:block;
margin-top:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h1>Welcome Back</h1>

<p>Login to your account</p>

<div id="phoneStep">

    <input
        id="phone"
        placeholder="Mobile Number"
        type="tel"
    >

    <button
        class="btn"
        id="sendOtpBtn"
    >
        Send OTP
    </button>

</div>


<div
    id="otpStep"
    style="display:none;"
>

    <input
        id="otp"
        placeholder="Enter OTP"
        type="text"
        inputmode="numeric"
        maxlength="6"
    >

    <button
        class="btn"
        id="verifyOtpBtn"
    >
        Verify OTP
    </button>

</div>


<p
    id="error"
    style="
        color:#B63A3A;
        margin-top:15px;
        display:none;
    "
></p>

<br>

<a href="register.html">
    Create Account
</a>

<a
    class="skip"
    href="/"
>
    Continue as Guest
</a>

</div>
<!-- Supabase (real backend) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/db.js"></script>

<script>

let loginPhone = "";


const error =
    document.getElementById("error");


document.getElementById("sendOtpBtn")
.onclick =
async function(){

    const phone =
        document.getElementById("phone")
        .value
        .trim();


    error.style.display =
        "none";


    if(!phone){

        error.innerText =
            "Please enter your mobile number.";

        error.style.display =
            "block";

        return;

    }


    const btn =
        document.getElementById("sendOtpBtn");


    btn.disabled =
        true;

    btn.innerText =
        "Sending OTP...";


    try {

        const result =
            await authSendLoginOtp(phone);


        loginPhone =
            result.phone;


        document.getElementById(
            "phoneStep"
        ).style.display =
            "none";


        document.getElementById(
            "otpStep"
        ).style.display =
            "block";


    } catch(err) {

        console.error(err);

        error.innerText =
            err.message ||
            "Unable to send OTP.";

        error.style.display =
            "block";


        btn.disabled =
            false;

        btn.innerText =
            "Send OTP";

    }

};


document.getElementById("verifyOtpBtn")
.onclick =
async function(){

    const otp =
        document.getElementById("otp")
        .value
        .trim();


    error.style.display =
        "none";


    if(!otp){

        error.innerText =
            "Please enter the OTP.";

        error.style.display =
            "block";

        return;

    }


    const btn =
        document.getElementById(
            "verifyOtpBtn"
        );


    btn.disabled =
        true;

    btn.innerText =
        "Verifying...";


    try {

        await authVerifyLoginOtp(

            loginPhone,

            otp

        );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const redirect =
            params.get("redirect");


        const safeRedirect =

            redirect &&
            /^[a-zA-Z0-9_-]+\.html$/
            .test(redirect)

                ? redirect

                : "home.html";


        window.location.href =
            safeRedirect;


    } catch(err) {

        console.error(err);

        error.innerText =
            err.message ||
            "Invalid OTP.";

        error.style.display =
            "block";


        btn.disabled =
            false;

        btn.innerText =
            "Verify OTP";

    }

};
</script>
</body>

</html>
