<!DOCTYPE html>

<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">


<title>Checkout</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/notifications.css">
<link rel="stylesheet" href="css/checkout.css">

<link rel="stylesheet" href="css/mobile.css">
</head>

<body>
<div id="headerContainer"></div>
<main class="wrap">


<h1>

Checkout

</h1>

<br>

<div class="card">

<label>Name</label>

<input id="customerName">

<label>Phone</label>

<input id="customerPhone">

<label>Delivery Location</label>

<button type="button" id="useCurrentLocationBtn" class="locationBtn">
📍 Use My Current Location
</button>

<div id="locationStatus" class="locationStatus"></div>

<label>Address</label>

<input id="customerAddress" placeholder="e.g. Near Main Market, Surankote, Poonch">

</div>

<div id="deliveryEstimateCard" class="card" style="display:none;">

<div id="deliveryEstimateList"></div>

</div>

<div class="card">

Payment:
Cash On Delivery

<br>

Delivery:
Normal

</div>

<button
class="btn"
id="placeOrderBtn">

Place Order

</button>

</div>
</main>
<div id="bottomNavContainer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/deliveryPricing.js"></script>
<script src="js/location.js"></script>
<script src="js/db.js"></script>

<script src="js/database.js"></script>
<script src="js/auth.js"></script>
<script src="js/product.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/checkout.js"></script>

<script>
renderLayout("cart");
</script>
</html>
