 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Hamara Bazaar</title>

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/notifications.css">
<style>

.profileHero{
    background:linear-gradient(135deg, #B63A3A, #667744);
    padding:36px 24px;
    color:white;
    border-radius:0 0 24px 24px;
    margin:-24px -20px 20px;
}

.profileHero .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:12px;
}

.profileHero h2{
    font-size:22px;
}

.profileHero p{
    opacity:.9;
    font-size:14px;
}

.profileCard{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.06);
}

.profileCard label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:#345D2A;
    margin-top:12px;
    margin-bottom:4px;
}

.profileCard input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

.profileCard input:disabled{
    background:#F7F7F7;
    color:#888;
}

.saveBtn{
    margin-top:16px;
    padding:12px 20px;
    background:#667744;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    width:100%;
}

.quickLinks a{
    display:block;
    background:white;
    padding:16px;
    border-radius:14px;
    margin-bottom:10px;
    text-decoration:none;
    color:#333;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.savedMsg{
    color:#345D2A;
    font-size:13px;
    margin-top:8px;
    display:none;
}

</style>

<link rel="stylesheet" href="css/mobile.css">
</head>

<body>

<div id="headerContainer"></div>

<main class="page" style="padding-top:0;">

    <div class="profileHero">
        <div class="avatar">👤</div>
        <h2 id="profileName">Loading...</h2>
        <p id="profileMarket"></p>
    </div>

    <div class="profileCard">

        <label>Full Name</label>
        <input id="editName">

        <label>Phone</label>
        <input id="editPhone">

        <label>Email</label>
        <input id="editEmail" disabled>

        <label>Area / Locality</label>
        <input id="editMarket">

        <button class="saveBtn" id="saveBtn">Save Changes</button>

        <div class="savedMsg" id="savedMsg">Saved!</div>

    </div>

    <div class="quickLinks">
        <a href="orders.html">📦 My Orders</a>
        <a href="role.html">🏪 My Business</a>
        <a href="services.html">🧰 Services</a>
        <a href="#" onclick="handleLogout(); return false;">🚪 Logout</a>
    </div>

</main>

<div id="bottomNavContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/deliveryPricing.js"></script>
<script src="js/db.js"></script>
<script src="js/database.js"></script>

<script src="js/components.js"></script>
<script src="js/profile.js"></script>

<script>
renderLayout("profile");
</script>

</body>

</html>
